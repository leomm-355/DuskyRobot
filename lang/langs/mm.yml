#menu - menu.py
menu : " 999_Core ကို **2022၊ ဩဂုတ် 10** ရက်နေ့က ဖန်တီးခဲ့တာ ဖြစ်ပါတယ်။ ကျွန်ုပ်တို့သည် **Pyrogram** လိုက်ဘရီကိုသာ အသုံးပြု၍ **Kutty Angel** နှင့် **999 Music** ပလပ်အင်များကို တည်ဆောက်ကာ ထိန်းသိမ်းပျိုးထူလျက် ရှိပါတယ်။\n\n• **ဖန်တီးသူ** : [999_Core](https://t.me/cores_999)\n• **ဘာသာစကား** : [python 3](https://www.python.org/)\n• **ဒေတာဘေ့စ်** : [Mongo db](https://cloud.mongodb.com/)\n• **ဆာဗာ** : [Myanmar](https://t.me/myanmarbot_music)\n• **ဗားရှင်း** : `1.0.9`\n\n@hex_king9"
back : "« နောက်သို့"

#main - main.py
main1 : " မင်္ဂလာပါရှင့် ! ကျွန်ုပ်က {} ဖြစ်ပါတယ်  \n\nသင့်အုပ်စုများကို ကာကွယ်ပေးပြီး လိုအပ်ချက်အားလုံးကို ဖြည့်ဆည်းပေးမည့် အဆင့်မြင့် တယ်လီဂရမ် အုပ်စုစီမံခန့်ခွဲမှု ဘော့တ်တစ်ခု ဖြစ်ပါတယ်။"
main2 : "**ကျွန်ုပ်ကို အသုံးပြုပုံနှင့်ပတ်သက်ပြီး မေးစရာရှိပါက ကျွန်ုပ်၏ PM သို့ လာခဲ့ပါ!**"
main3 : "ဒီကိုနှိပ်ပါ"
main4 : "{} အကြောင်း အကူအညီရယူရန် အောက်ပါခလုတ်ကို နှိပ်ပါ"
main5 : "**အကူအညီမီနူးမှ ကြိုဆိုပါတယ်**\n\nကျွန်ုပ်သည် အသုံးဝင်သော လုပ်ဆောင်ချက်အချို့ပါရှိသည့် အုပ်စုစီမံခန့်ခွဲမှု ဘော့တ်တစ်ခု ဖြစ်ပါတယ်။\nအောက်ပါခလုတ်များကို နှိပ်၍ ရွေးချယ်နိုင်ပါတယ်။\nအသုံးပြုပုံနှင့်ပတ်သက်၍ အမှားအယွင်း သို့မဟုတ် မေးခွန်းများရှိပါက \nကျွန်ုပ်တို့၏ [ပံ့ပိုးမှုအုပ်စု (Support Group)](https://t.me/DuskysSupport) သို့မဟုတ် @DuskysUpdates သို့ ဝင်ရောက်ကြည့်ရှုပါ။\n\n**အမိန့်ခိုင်းစေချက် (Commands) အားလုံးကို အောက်ပါသင်္ကေတဖြင့် အသုံးပြုနိုင်သည်: / **"
main6 : "**{}** အတွက် အကူအညီ"

